# 학회명 표기 예외 테이블
#
# 기본 규칙: 시트('학술발표목록')의 학회명에 한글이 포함되어 있으면 앞에 "한국"을 붙여
# 정식명칭으로 만든다. 영문 학회명(icRS, CIGR, PAWEES, GreenSys, AGU, jpGU)은 그대로 둔다.
# 시트의 '국내외' 컬럼은 기준으로 쓰지 않는다 — 2025 추계 제주 생물환경조절학회 1건이
# '국제'로 잘못 찍혀 있어 같은 학회가 두 이름으로 갈리기 때문.
#
# 이 규칙이 안 맞는 학회만 여기에 적는다. 예: "대한"으로 시작하는 학회는
# 규칙대로면 "한국대한원격탐사학회"가 되어버리므로 아래처럼 명시해야 한다.
#
#   대한원격탐사학회: 대한원격탐사학회
#
# 현재 시트에 등장하는 14개 학회는 모두 기본 규칙으로 정확히 변환되므로 비어 있다.
